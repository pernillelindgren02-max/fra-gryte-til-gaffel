<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Middag — big plate + clear meal + cutlery -->
  <circle cx="60" cy="60" r="56" fill="#eef1df"/>
  <!-- plate -->
  <circle cx="58" cy="64" r="34" fill="#fff" stroke="#255957" stroke-width="4.5"/>
  <circle cx="58" cy="64" r="24" fill="#f3efdf"/>
  <!-- meal: steak + mash + greens — large shapes -->
  <ellipse cx="48" cy="62" rx="13" ry="11" fill="#c8544f"/>
  <ellipse cx="70" cy="68" rx="11" ry="9" fill="#eacd6a"/>
  <circle cx="66" cy="52" r="8" fill="#859400"/>
  <!-- fork -->
  <path d="M18 36v42" stroke="#255957" stroke-width="4" stroke-linecap="round"/>
  <path d="M13 36v14M18 36v14M23 36v14" stroke="#255957" stroke-width="3" stroke-linecap="round"/>
  <!-- knife -->
  <path d="M98 38v40" stroke="#255957" stroke-width="4" stroke-linecap="round"/>
  <path d="M98 38c8 6 8 16 0 22Z" fill="#255957"/>
</svg>
