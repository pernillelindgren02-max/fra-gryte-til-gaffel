  <!-- bun disc -->
  <circle cx="60" cy="62" r="34" fill="#e8c56a" stroke="#255957" stroke-width="3.5"/>
  <!-- continuous cinnamon spiral from rim to centre -->
  <path
    d="M88 62
       C88 46 76 36 60 36
       C44 36 34 46 34 62
       C34 76 44 86 58 86
       C70 86 78 78 78 68
       C78 58 70 52 60 52
       C52 52 46 58 46 66
       C46 72 52 76 58 76
       C64 76 68 72 68 68
       C68 64 64 62 60 62"
    stroke="#c8544f"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- soft sugar highlight -->
  <path d="M42 44c8-5 16-4 22 2" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <circle cx="60" cy="62" r="4" fill="#ee7939"/>
