  <circle cx="40" cy="54" r="18" fill="#859400"/>
  <circle cx="80" cy="54" r="18" fill="#7d9200"/>
  <circle cx="60" cy="38" r="20" fill="#95a82a"/>
  <circle cx="50" cy="58" r="15" fill="#859400"/>
  <circle cx="70" cy="58" r="15" fill="#8a9e10"/>
  <!-- one soft highlight -->
  <circle cx="54" cy="34" r="6" fill="#d5dba2" opacity=".4"/>
