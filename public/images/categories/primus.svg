<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Perfekt til primus — bold camping stove silhouette -->
  <circle cx="60" cy="60" r="56" fill="#eef1df"/>
  <!-- three legs -->
  <path d="M36 90 L48 68" stroke="#255957" stroke-width="5" stroke-linecap="round"/>
  <path d="M84 90 L72 68" stroke="#255957" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 94 L60 72" stroke="#255957" stroke-width="5" stroke-linecap="round"/>
  <!-- round burner base -->
  <ellipse cx="60" cy="68" rx="28" ry="10" fill="#255957"/>
  <!-- pot -->
  <rect x="38" y="42" width="44" height="28" rx="8" fill="#255957"/>
  <rect x="34" y="38" width="52" height="10" rx="4" fill="#1e4a48"/>
  <!-- handle -->
  <path d="M48 38c0-16 8-24 12-24s12 8 12 24" stroke="#c8544f" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- single clear flame above rim -->
  <ellipse cx="60" cy="32" rx="5" ry="9" fill="#ee7939"/>
  <ellipse cx="60" cy="30" rx="2.5" ry="5" fill="#eacd6a"/>
  <!-- control knob -->
  <circle cx="60" cy="56" r="6" fill="#eacd6a"/>
</svg>
