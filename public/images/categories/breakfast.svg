<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Frokost — simple soft egg + bacon -->
  <circle cx="60" cy="60" r="56" fill="#eef1df"/>
  <!-- soft plate hint -->
  <ellipse cx="62" cy="68" rx="36" ry="28" fill="#fff" stroke="#255957" stroke-width="3"/>
  <!-- bacon strips — wavy, clear fat streak -->
  <path d="M28 48c12-10 28-8 34 6" stroke="#c8544f" stroke-width="10" stroke-linecap="round"/>
  <path d="M30 50c10-8 24-6 30 4" stroke="#f0a090" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M26 62c14-10 30-8 36 6" stroke="#ee7939" stroke-width="9" stroke-linecap="round"/>
  <path d="M28 63c12-8 26-6 32 4" stroke="#f5c4a0" stroke-width="3" stroke-linecap="round"/>
  <!-- fried egg — soft irregular white + clear yolk -->
  <path d="M58 50c-6-10 0-20 12-22 10-1 22 6 22 18 1 10-6 20-16 22-12 2-20-6-18-18Z" fill="#fff" stroke="#255957" stroke-width="2.5"/>
  <circle cx="74" cy="60" r="11" fill="#eacd6a"/>
  <circle cx="77" cy="57" r="3" fill="#f5e08a" opacity=".8"/>
</svg>
